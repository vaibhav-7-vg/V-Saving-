<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Savings">
<link rel="manifest" href="manifest.json">
<title>My Savings</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--green:#087f5b;
--green2:#dff8ec;
--mint:#bff3d8;
--red:#ef5b5b;
--orange:#ff9b2f;
--blue:#3d8bfd;
--purple:#8a5cf6;
--ink:#17251f;
--muted:#718078;
--bg:#f4f8f6;
--card:#fff;
--line:#e6eeea;
--shadow:0 8px 25px rgba(21,70,52,.08)
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
background:var(--bg);
color:var(--ink)
}

button,input,select{font:inherit}
button{border:0;cursor:pointer}

.app{
max-width:520px;
margin:auto;
min-height:100vh;
padding-bottom:82px
}

header{
padding:22px 18px 12px;
display:flex;
justify-content:space-between;
align-items:center;
background:var(--bg);
position:sticky;
top:0;
z-index:5
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.brand-icon{
width:40px;
height:40px;
border-radius:13px;
object-fit:cover
}

.brand b{font-size:20px}

.brand small{
display:block;
color:var(--muted);
font-size:11px;
margin-top:1px
}

.iconbtn{
width:40px;
height:40px;
border-radius:14px;
background:#fff;
box-shadow:var(--shadow);
font-size:18px
}

main{padding:0 16px}

.hero{
background:linear-gradient(135deg,#087f5b,#10a36f);
color:white;
border-radius:25px;
padding:22px;
margin:5px 0 14px;
box-shadow:0 14px 30px rgba(8,127,91,.22);
position:relative;
overflow:hidden
}

.hero:after{
content:"";
position:absolute;
width:150px;
height:150px;
border-radius:50%;
background:rgba(255,255,255,.09);
right:-45px;
top:-50px
}

.hero-label{font-size:12px;opacity:.82}

.hero-value{
font-size:38px;
font-weight:800;
letter-spacing:-1px;
margin:4px 0 8px
}

.hero-sub{
font-size:12px;
opacity:.9
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px;
margin-bottom:14px
}

.stat{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:15px;
box-shadow:var(--shadow)
}

.stat span{
font-size:11px;
color:var(--muted)
}

.stat b{
display:block;
font-size:21px;
margin-top:4px
}

.spent b{color:var(--red)}
.saved b{color:var(--green)}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:17px;
margin-bottom:14px;
box-shadow:var(--shadow)
}

.card-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:13px
}

.card-title b{font-size:16px}

.muted{
color:var(--muted);
font-size:12px
}

.quick{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.quick button{
padding:13px;
border-radius:15px;
font-weight:700
}

.receive{
background:var(--green2);
color:var(--green)
}

.expense{
background:#fff0f0;
color:#d94949
}

.progress{
height:9px;
background:#edf2ef;
border-radius:99px;
overflow:hidden
}

.progress i{
display:block;
height:100%;
background:linear-gradient(90deg,#22b573,#75dcae);
border-radius:99px;
width:0
}

.goal-row{
display:flex;
justify-content:space-between;
align-items:end;
margin-bottom:8px
}

.goal-row b{font-size:20px}

.goal-edit{
color:var(--green);
font-size:12px;
background:none;
padding:0
}

.tip{
background:#fff8dc;
border:1px solid #f8e9a7;
border-radius:16px;
padding:13px;
font-size:12px;
line-height:1.45
}

.tip b{color:#7b6410}

.chart{
display:flex;
gap:18px;
align-items:center
}

.donut{
width:116px;
height:116px;
border-radius:50%;
background:conic-gradient(
#ff9b2f 0 25%,
#3d8bfd 25% 48%,
#8a5cf6 48% 63%,
#aab5b0 63% 100%
);
position:relative;
flex:none
}

.donut:after{
content:"";
position:absolute;
inset:27px;
background:white;
border-radius:50%
}

.legend{flex:1}

.legend div{
display:flex;
justify-content:space-between;
font-size:12px;
margin:9px 0
}

.dot{
width:8px;
height:8px;
border-radius:50%;
display:inline-block;
margin-right:7px
}

.history-item{
display:flex;
justify-content:space-between;
gap:10px;
padding:13px 0;
border-bottom:1px solid var(--line)
}

.history-item:last-child{border-bottom:0}

.hleft{
display:flex;
gap:10px;
min-width:0
}

.cat{
width:38px;
height:38px;
border-radius:13px;
display:grid;
place-items:center;
flex:none
}

.cat.food{background:#fff0dc}
.cat.travel{background:#e5f0ff}
.cat.stationery{background:#eee7ff}
.cat.other{background:#e9eeee}

.hleft b{
display:block;
font-size:13px
}

.hleft small{
display:block;
color:var(--muted);
font-size:10px;
margin-top:3px
}

.amount{
font-weight:800;
color:var(--red);
white-space:nowrap
}

.empty{
text-align:center;
color:var(--muted);
padding:24px 8px;
font-size:13px
}

.insight{
display:flex;
gap:12px;
padding:13px 0;
border-bottom:1px solid var(--line)
}

.insight:last-child{border-bottom:0}

.insight-icon{
width:39px;
height:39px;
border-radius:13px;
display:grid;
place-items:center;
background:var(--green2);
flex:none
}

.insight b{font-size:13px}

.insight p{
font-size:11px;
color:var(--muted);
margin:4px 0;
line-height:1.4
}

.save-pill{
display:inline-block;
background:var(--green2);
color:var(--green);
padding:5px 8px;
border-radius:99px;
font-size:10px;
font-weight:800
}

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(520px,100%);
background:rgba(255,255,255,.95);
backdrop-filter:blur(12px);
border-top:1px solid var(--line);
display:grid;
grid-template-columns:repeat(4,1fr);
padding:8px 10px calc(8px + env(safe-area-inset-bottom));
z-index:10
}

.nav{
background:none;
color:#8a958f;
font-size:10px;
padding:6px
}

.nav strong{
display:block;
font-size:18px;
line-height:18px;
margin-bottom:3px
}

.nav.active{color:var(--green)}

.modal{
position:fixed;
inset:0;
background:rgba(15,32,25,.45);
display:none;
align-items:flex-end;
z-index:30
}

.modal.show{display:flex}

.sheet{
background:white;
width:min(520px,100%);
margin:auto 0 0;
border-radius:26px 26px 0 0;
padding:20px 18px calc(22px + env(safe-area-inset-bottom));
max-height:88vh;
overflow:auto
}

.sheet h2{
margin:0 0 16px;
font-size:20px
}

.field{margin:11px 0}

.field label{
display:block;
font-size:11px;
font-weight:700;
color:#52605a;
margin-bottom:6px
}

.field input,
.field select{
width:100%;
padding:13px;
border:1px solid #dce6e1;
border-radius:14px;
outline:none;
background:#fbfdfc
}

.field input:focus,
.field select:focus{
border-color:#62b895
}

.cats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px
}

.catpick{
padding:10px 4px;
background:#f4f7f5;
border:1px solid var(--line);
border-radius:13px;
font-size:10px
}

.catpick.sel{
border:2px solid var(--green);
background:var(--green2)
}

.primary{
width:100%;
padding:14px;
border-radius:15px;
background:var(--green);
color:white;
font-weight:800;
margin-top:8px
}

.secondary{
width:100%;
padding:12px;
border-radius:15px;
background:#f0f4f2;
color:#51615a;
font-weight:700;
margin-top:8px
}

.danger{
width:100%;
padding:12px;
border-radius:15px;
background:#fff0f0;
color:#d94949;
font-weight:700;
margin-top:8px
}

.toast{
position:fixed;
left:50%;
bottom:92px;
transform:translate(-50%,20px);
background:#17352a;
color:#fff;
padding:11px 15px;
border-radius:13px;
font-size:12px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:50
}

.toast.show{
opacity:1;
transform:translate(-50%,0)
}

.fade{animation:fade .3s ease}

@keyframes fade{
from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:none}
}

@media(min-width:600px){
body{padding:10px 0}
.app{
border-radius:28px;
background:var(--bg);
box-shadow:0 0 50px rgba(0,0,0,.08)
}
}

.premium-btn{
background:#fff7df;
color:#8a6500;
border:1px solid #f1df9b;
box-shadow:var(--shadow);
padding:10px 12px;
border-radius:14px;
font-weight:800;
font-size:11px
}

.premium-hero{
background:linear-gradient(135deg,#17251f,#315c4c);
color:#fff;
border-radius:22px;
padding:19px;
margin-bottom:14px;
box-shadow:0 12px 28px rgba(21,70,52,.16)
}

.premium-hero h2{
margin:0 0 6px;
font-size:20px
}

.premium-hero p{
margin:0;
color:rgba(255,255,255,.78);
font-size:11px;
line-height:1.45
}

.plan-card{
background:#fff;
border:1px solid var(--line);
border-radius:18px;
padding:15px;
margin-top:10px
}

.plan-card.premium{
border:2px solid #d6b75b
}

.plan-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.plan-name{
font-weight:800;
font-size:15px
}

.price{
font-weight:900;
font-size:20px
}

.feature-list{
list-style:none;
padding:0;
margin:13px 0 0
}

.feature-list li{
padding:7px 0;
font-size:12px;
border-bottom:1px solid var(--line)
}

.feature-list li:last-child{border-bottom:0}

.feature-list li:before{
content:'✓';
color:var(--green);
font-weight:900;
margin-right:8px
}

.badge-free{
background:#edf2ef;
color:#52605a;
padding:5px 8px;
border-radius:99px;
font-size:10px;
font-weight:800
}

.badge-premium{
background:#fff0bd;
color:#7b5b00;
padding:5px 8px;
border-radius:99px;
font-size:10px;
font-weight:800
}

.auth-status{
font-size:10px;
color:var(--muted);
margin-right:2px;
max-width:90px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.account-btn{
background:#fff;
border:1px solid var(--line);
box-shadow:var(--shadow);
padding:9px 10px;
border-radius:14px;
font-weight:800;
font-size:11px;
color:var(--ink)
}

.auth-note{
background:var(--green2);
border-radius:14px;
padding:10px;
font-size:11px;
line-height:1.45;
margin-bottom:12px
}

.small-card{
background:#f7faf8;
border:1px solid var(--line);
border-radius:14px;
padding:12px;
margin:8px 0;
font-size:12px
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">
<img class="brand-icon" src="icons/icon-192.png">
<div>
<b>My Savings</b>
<small>Track • Spend • Grow</small>
</div>
</div>

<div style="display:flex;gap:6px;align-items:center">

<span id="authStatus" class="auth-status">Guest</span>

<button
class="account-btn"
onclick="openAccount()">
👤 Account
</button>

<button
class="premium-btn"
onclick="openPremium()">
⭐ Premium
</button>

<button
class="iconbtn"
onclick="openGoal()"
aria-label="Savings goal">
🎯
</button>

</div>

</header>

<main id="content"></main>

<nav class="bottom">

<button
class="nav active"
data-tab="home"
onclick="go('home')">
<strong>⌂</strong>
Home
</button>

<button
class="nav"
data-tab="add"
onclick="openAdd()">
<strong>＋</strong>
Add
</button>

<button
class="nav"
data-tab="history"
onclick="go('history')">
<strong>▤</strong>
History
</button>

<button
class="nav"
data-tab="insights"
onclick="go('insights')">
<strong>◒</strong>
Insights
</button>

</nav>

</div>

<div
class="modal"
id="modal"
onclick="if(event.target===this)closeModal()">

<div
class="sheet"
id="sheet">
</div>

</div>

<div
class="toast"
id="toast">
</div>

<script>

/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
'https://avfacqcbxzlirxbzqwiu.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_BKi6yl58JUAJ0U-ccWn3QA_7eFlq8i4';

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;


/* =====================================================
   LOCAL APP DATA
   ===================================================== */

const KEY='mySavings_v1';

const SUB_KEY='mySavings_subscription_v1';

const APP_CONFIG={
monthlyPrice:49,
yearlyPrice:399
};

const PREMIUM_FEATURES=[
'Multiple savings goals',
'Advanced spending analysis',
'Monthly financial reports',
'Budget limits',
'Recurring income & expenses',
'Export reports',
'Advanced savings prediction',
'Backup & cloud sync'
];

let subscription=
JSON.parse(
localStorage.getItem(SUB_KEY)||'null'
)||{
plan:'free',
status:'inactive',
expiresAt:null
};

function isPremium(){

return(
subscription.plan==='premium' &&
subscription.status==='active'
);

}

function requirePremium(feature){

if(isPremium())return true;

openPremium(feature);

return false;

}


let db=
JSON.parse(
localStorage.getItem(KEY)||'null'
)||{
received:[],
expenses:[],
borrowed:[],
repayments:[],
goal:10000
};

db.borrowed=db.borrowed||[];
db.repayments=db.repayments||[];


const cats={
Food:{
emoji:'🍔',
cls:'food'
},

Travel:{
emoji:'🚌',
cls:'travel'
},

Stationery:{
emoji:'📚',
cls:'stationery'
},

Other:{
emoji:'•••',
cls:'other'
}
};


let currentTab='home';


/* =====================================================
   BASIC HELPERS
   ===================================================== */

function save(){

localStorage.setItem(
KEY,
JSON.stringify(db)
);

}

function money(n){

return '₹'+
Math.round(n||0)
.toLocaleString('en-IN');

}

function sum(a){

return a.reduce(
(x,y)=>x+Number(y.amount||0),
0
);

}

function totalReceived(){

return sum(db.received);

}

function totalSpent(){

return sum(db.expenses);

}

function totalBorrowed(){

return sum(
db.borrowed.filter(
x=>!x.repaid
)
);

}

function totalRepaid(){

return sum(db.repayments);

}

function savingsBalance(){

return totalReceived()-totalSpent();

}

function balance(){

return(
totalReceived()+
sum(db.borrowed)-
totalSpent()-
totalRepaid()
);

}

function monthKey(d){

let x=new Date(d);

return(
x.getFullYear()+
'-'+
String(x.getMonth()+1).padStart(2,'0')
);

}

function thisMonth(){

let k=monthKey(new Date());

return{

received:
sum(
db.received.filter(
x=>monthKey(x.date)===k
)
),

spent:
sum(
db.expenses.filter(
x=>monthKey(x.date)===k
)
)

};

}

function esc(s){

return String(s||'')
.replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);

}


/* =====================================================
   AUTH
   ===================================================== */

function updateAuthStatus(){

const el=
document.getElementById('authStatus');

if(!el)return;

el.textContent=
currentUser?
(currentUser.email||'Signed in'):
'Guest';

}


async function refreshAuth(){

try{

const {data}=await
supabaseClient.auth.getSession();

currentUser=
data.session?.user||null;

updateAuthStatus();

}catch(e){

console.error(e);

}

}


function authValues(){

const email=
document.getElementById('authEmail')
?.value.trim();

const password=
document.getElementById('authPassword')
?.value;

return{
email,
password
};

}


async function signUpAccount(){

const {email,password}=
authValues();

if(!email)
return toast('Enter your email');

if(!password || password.length<6)
return toast('Password must be 6+ characters');

try{

const {data,error}=
await supabaseClient.auth.signUp({
email,
password
});

if(error)
throw error;

if(data.user){

currentUser=data.user;

updateAuthStatus();

closeModal();

toast(
data.session?
'Account created':
'Account created. Check your email.'
);

}

}catch(error){

console.error(error);

toast(
error.message||
'Could not create account'
);

}

}


async function signInAccount(){

const {email,password}=
authValues();

if(!email)
return toast('Enter your email');

if(!password)
return toast('Enter your password');

try{

const {data,error}=
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error)
throw error;

currentUser=
data.user;

updateAuthStatus();

closeModal();

toast('Signed in successfully');

}catch(error){

console.error(error);

toast(
error.message||
'Sign in failed'
);

}

}


async function signOutAccount(){

try{

const {error}=
await supabaseClient.auth.signOut();

if(error)
throw error;

currentUser=null;

updateAuthStatus();

closeModal();

toast('Signed out');

}catch(error){

console.error(error);

toast(
error.message||
'Sign out failed'
);

}

}


async function openAccount(){

document
.getElementById('modal')
.classList.add('show');

if(currentUser){

document
.getElementById('sheet')
.innerHTML=`

<h2>👤 Your Account</h2>

<div class="auth-note">

Signed in as
<b>${esc(currentUser.email||'')}</b>

<br><br>

Your My Savings account is connected.

</div>

<div class="small-card">

<strong>Account status</strong>

<br>

🟢 Signed in

</div>

<div class="small-card">

<strong>Premium</strong>

<br>

${isPremium()?
'⭐ Premium active':
'Free plan'}

</div>

<button
class="primary"
onclick="signOutAccount()">

Sign out

</button>

<button
class="secondary"
onclick="closeModal()">

Close

</button>

`;

return;

}


document
.getElementById('sheet')
.innerHTML=`

<h2>👤 My Savings Account</h2>

<div class="auth-note">

Create an account to prepare your data
for cloud sync and Premium features.

<br><br>

Your existing local data stays on this
device for now.

</div>

<div class="field">

<label>Email</label>

<input
id="authEmail"
type="email"
autocomplete="email"
placeholder="you@example.com">

</div>

<div class="field">

<label>Password</label>

<input
id="authPassword"
type="password"
autocomplete="new-password"
placeholder="At least 6 characters">

</div>

<button
class="primary"
onclick="signUpAccount()">

Create account

</button>

<button
class="secondary"
onclick="signInAccount()">

I already have an account — Sign in

</button>

<button
class="secondary"
onclick="closeModal()">

Maybe later

</button>

`;

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function go(tab){

currentTab=tab;

document
.querySelectorAll('.nav')
.forEach(n=>
n.classList.toggle(
'active',
n.dataset.tab===tab
)
);

render();

}


function render(){

const m=thisMonth();

const total=totalSpent();

const rec=totalReceived();

const bal=balance();

if(currentTab==='home')
renderHome(
m,
rec,
total,
bal
);

if(currentTab==='history')
renderHistory();

if(currentTab==='insights')
renderInsights();

window.scrollTo({
top:0,
behavior:'smooth'
});

}


/* =====================================================
   HOME
   ===================================================== */

function renderHome(
m,
rec,
total,
bal
){

const goal=
Math.max(
1,
Number(db.goal)||10000
);

const gp=
Math.max(
0,
Math.min(
100,
savingsBalance()/goal*100
)
);

const recent=
[...db.expenses]
.sort(
(a,b)=>
new Date(b.date)-
new Date(a.date)
)
.slice(0,4);

const by=catTotals();

document
.getElementById('content')
.innerHTML=`

<div class="fade">

<section class="hero">

<div class="hero-label">
Money remaining
</div>

<div class="hero-value">
${money(bal)}
</div>

/* =====================================================
   CHART
   ===================================================== */

function catTotals(){

let o={
Food:0,
Travel:0,
Stationery:0,
Other:0
};

db.expenses.forEach(x=>{

o[x.category]=
(o[x.category]||0)+
Number(x.amount);

});

return o;

}


function donutStyle(by,total){

if(!total)
return'background:#e6eeea';

let p=0;

let parts=[];

const colors=[
'#ff9b2f',
'#3d8bfd',
'#8a5cf6',
'#aab5b0'
];

Object.entries(by)
.forEach(
([k,v],i)=>{

if(v>0){

let start=p;

p+=
v/total*100;

parts.push(
`${colors[i]} ${start}% ${p}%`
);

}

}
);

return`
background:conic-gradient(
${parts.join(',')}
)`;

}


function legend(by,total){

return Object
.entries(by)
.map(
([k,v],i)=>{

let pct=
total?
Math.round(v/total*100):
0;

return`

<div>

<span>

<span
class="dot"
style="background:${
[
'#ff9b2f',
'#3d8bfd',
'#8a5cf6',
'#aab5b0'
][i]
}">
</span>

${cats[k].emoji}
${k}

</span>

<b>
${pct}%
</b>

</div>
`;

}
)
.join('');

}


function smartTip(by,total){

if(!total)
return'Start recording expenses to get personalized spending advice.';

const top=
Object.entries(by)
.sort((a,b)=>b[1]-a[1])
[0];

if(!top || top[1]<=0)
return'Keep tracking your expenses to discover your biggest spending area.';

const pct=
Math.round(top[1]/total*100);

return`
${top[0]} is your highest spending category
at ${pct}%. Try reducing it slightly this month
and move the difference into savings.
`;

}


function itemHTML(x){

const c=
cats[x.category]||
cats.Other;

return`

<div class="history-item">

<div class="hleft">

<div class="cat ${c.cls}">
${c.emoji}
</div>

<div>

<b>
${esc(x.category)}

${esc(x.note||'Expense')} • ${esc(x.date)}
</small>

</div>

</div>

<div class="amount">
-${money(x.amount)}
</div>

</div>

`;

}

function saveRepay(id){

let x=
db.borrowed.find(
b=>b.id===id
);

if(!x)return;

let due=
Number(x.amount)-
Number(x.paid||0);

let a=
Number(
document
.getElementById('repayAmount')
.value
);

if(!(a>0))
return toast('Enter repayment amount');

if(a>due)
return toast('Amount is more than remaining');

x.paid=
Number(x.paid||0)+a;

x.repaid=
x.paid>=x.amount;

db.repayments.push({

id:Date.now().toString(),

borrowedId:id,

amount:a,

date:
document
.getElementById('repayDate')
.value

});

save();

closeModal();

toast(
x.repaid?
'Fully repaid':
'Repayment saved'
);

go('history');

}
